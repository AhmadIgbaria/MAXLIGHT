<script>

let sb = null;
let sbInitError = null;
try {
  if (typeof window.supabase === "undefined") {
    sbInitError = "ספריית Supabase לא נטענה מהאינטרנט (ייתכן חוסם פרסומות, רשת חוסמת, או בעיית חיבור). נסה לרענן, לכבות חוסם פרסומות, או לנסות רשת/דפדפן אחר.";

/* ============================================================

   ============================================================
   1. הירשם בחינם ב-emailjs.com
   2. Email Services -> Add New Service -> חבר את ה-Gmail שלך -> תעתיק Service ID
   3. Email Templates -> Create New Template -> תשתמש במשתנים {{to_email}} {{subject}} {{message}} -> תעתיק Template ID
   4. Account -> General -> Public Key -> תעתיק אותו
   5. תדביק את שלושתם למטה, תמלא MANAGER_EMAIL, ותשנה ENABLED ל-true
   ============================================================ */
const EMAIL_CONFIG = {
  ENABLED: true,
  PUBLIC_KEY: "Cy4csv4_eP_qJU191",
  SERVICE_ID: "service_3bssnwn",
  TEMPLATE_ID: "template_prfo4ky",
  MANAGER_EMAIL: "ahmadtaha@starlighting.co.il",
};
if (EMAIL_CONFIG.ENABLED && typeof emailjs !== "undefined") {
  try { emailjs.init(EMAIL_CONFIG.PUBLIC_KEY); } catch (e) { console.error("EmailJS init failed:", e); }
}
function sendEmailNotification(toEmail, subject, message) {
  if (!EMAIL_CONFIG.ENABLED || !toEmail || typeof emailjs === "undefined") return;
  emailjs.send(EMAIL_CONFIG.SERVICE_ID, EMAIL_CONFIG.TEMPLATE_ID, {
    to_email: toEmail, subject: subject, message: message,
  }).catch(err => console.error("שליחת מייל נכשלה:", err));
}
function technicianEmail(name) {
  const u = state.users.find(x => x.role === "technician" && x.name === name);
  return u ? u.email : null;
}

function nowStr() {
  return new Date().toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" });
}
function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" });
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtNum(n) { return "#" + String(n).padStart(4, "0"); }
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   אשף תיאור תקלה ממוקד (מזגן / תאורה)
   ============================================================ */
const AC_ISSUES = {
  "נוזל / מטפטף": {
    icon: "💧",
    question: "מאיפה המים מטפטפים?",
    options: [
      "מתוך היחידה שבתוך הבית (על הקיר/רצפה)",
      "מהצינור או המנוע שנמצאים בחוץ",
    ],
  },
  "לא מקרר / לא מחמם": {
    icon: "❄️",
    question: "מה המזגן עושה בפועל?",
    options: [
      { label: "מוציא רק רוח פושרת (כמו מאוורר)", followUp: {
        question: "האם המנוע/המאוורר בחוץ מסתובב ועובד?",
        options: ["כן, עובד כרגיל", "לא, שקט לחלוטין", "לא יודע / אין לי גישה לראות"],
      }},
      { label: "לא מוציא אוויר בכלל מהתריסים" },
      { label: "עובד כמה דקות, מפסיק, ואז חוזר לעבוד" },
    ],
  },
  "לא נדלק בכלל / מקצר את החשמל": {
    icon: "🔌",
    question: "מה קורה כשמנסים להדליק?",
    options: [
      'המזגן מקפיץ את החשמל בלוח (את הממ"ת או הפחת)',
      "המזגן משמיע צפצוף (ביפ) אבל לא נדלק",
      "אין שום תגובה, אין אורות ואין צפצוף (מת לחלוטין)",
    ],
  },
  "משמיע רעשים חזקים וחריגים": {
    icon: "🔊",
    question: "מאיפה מגיע הרעש ואיך הוא נשמע?",
    options: [
      "רעש של חריקות או דפיקות מהיחידה בתוך הבית",
      "רעש חזק מאוד של רעידות מהמנוע בחוץ",
      "רעש של שריקה או זרימת אוויר חנוקה",
    ],
  },
  "יש ריח רע מהמזגן": {
    icon: "🤢",
    question: "איזה סוג ריח יש באוויר?",
    options: [
      "ריח חזק של עובש, טחב או לחות",
      "ריח חריף של שרוף (כמו פלסטיק או חוטים)",
      "ריח של נבלה או חיה מתה",
    ],
  },
  "מציג קוד תקלה על המסך": {
    icon: "🔢",
    freeTextQuestion: "אנא הקלד את האותיות והמספרים שמופיעים על צג המזגן או השלט",
    freeTextPlaceholder: "לדוגמה: E5, F2...",
  },
  "אחר": {
    icon: "❓",
    freeTextQuestion: "תאר את התקלה בקצרה במילים שלך",
    freeTextPlaceholder: "כתוב כאן את התיאור...",
  },
};

const LIGHT_PROBLEMS = ["לא נדלק בכלל", "מקצר את החשמל", "מהבהב / מרצד", "אור חלש מאוד", "רעש של זמזום מהמנורה", "אחר"];
const LIGHT_TYPES = ["נורת לד (LED)", "נורה רגילה / הברגה (להט / הלוגן)", "פס לדים / ספוטים"];
const LIGHT_COLORS = ["3000K (אור חם)", "4000K (אור ניטרלי)", "6000K (אור קר)", "CCT (גוון מתחלף)", "RGB (צבעוני)"];

function blankWizard() {
  return {
    category: null,
    ac: { issue: null, followUp: null, followUp2: null, freeText: "" },
    light: { problem: null, lampType: null, color: null, otherText: "" },
  };
}
function resetWizard() { state.wizard = blankWizard(); }

function composeACDescription() {
  const ac = state.wizard.ac;
  if (!ac.issue) return null;
  const conf = AC_ISSUES[ac.issue];
  const parts = ["מזגן", ac.issue];
  if (conf.freeTextQuestion) {
    if (!ac.freeText.trim()) return null;
    parts.push("קוד תקלה: " + ac.freeText.trim());
    return parts.join(" — ");
  }
  if (!ac.followUp) return null;
  parts.push(ac.followUp);
  const opt = conf.options.find(o => (typeof o === "string" ? o : o.label) === ac.followUp);
  if (opt && opt.followUp) {
    if (!ac.followUp2) return null;
    parts.push(ac.followUp2);
  }
  return parts.join(" — ");
}
function composeLightDescription() {
  const l = state.wizard.light;
  if (!l.problem) return null;
  if (l.problem === "אחר") {
    if (!l.otherText || !l.otherText.trim()) return null;
    return "תאורה — אחר — " + l.otherText.trim();
  }
  const parts = ["תאורה", l.problem];
  if (!l.lampType) return null;
  parts.push("סוג: " + l.lampType);
  const needsColor = l.lampType === "נורת לד (LED)" || l.lampType === "פס לדים / ספוטים";
  if (needsColor) {
    if (!l.color) return null;
    parts.push("גוון: " + l.color);
  }
  return parts.join(" — ");
}
function getComposedDescription() {
  if (state.wizard.category === "מזגן") return composeACDescription();
  if (state.wizard.category === "תאורה") return composeLightDescription();
  return null;
}

function goBackOneWizardStep() {
  const w = state.wizard;
  if (w.category === "מזגן") {
    const ac = w.ac;
    const conf = ac.issue ? AC_ISSUES[ac.issue] : null;
    if (conf && conf.freeTextQuestion) { ac.issue = null; ac.freeText = ""; return; }
    if (ac.followUp2) { ac.followUp2 = null; return; }
    if (ac.followUp) { ac.followUp = null; return; }
    if (ac.issue) { ac.issue = null; return; }
  }
  if (w.category === "תאורה") {
    const l = w.light;
    if (l.problem === "אחר") { l.problem = null; l.otherText = ""; return; }
    if (l.color) { l.color = null; return; }
    if (l.lampType) { l.lampType = null; return; }
    if (l.problem) { l.problem = null; return; }
  }
}

function wizardHtml() {
  const w = state.wizard;

  if (!w.category) {
    return `
      <div style="display:flex; gap:10px">
        <button type="button" class="wizBtn wizCategory" data-cat="מזגן" style="flex:1; padding:18px 8px; font-size:17px; text-align:center; border:1px solid #e2e8f0; border-radius:8px; background:#fff; cursor:pointer">❄️<br>מזגן</button>
        <button type="button" class="wizBtn wizCategory" data-cat="תאורה" style="flex:1; padding:18px 8px; font-size:17px; text-align:center; border:1px solid #e2e8f0; border-radius:8px; background:#fff; cursor:pointer">💡<br>תאורה</button>
      </div>
    `;
  }

  const composed = getComposedDescription();
  if (composed) {
    return `
      <div style="background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; padding:10px; margin-bottom:8px">
        <div class="light" style="font-size:13px; margin-bottom:2px">תיאור שנוצר:</div>
        <div style="font-size:15px; color:#065f46">${esc(composed)}</div>
      </div>
      <button type="button" class="btn-dark-sm" id="wizResetBtn">🔄 התחל תיאור מחדש</button>
    `;
  }

  let html = `<div class="light" style="font-size:13px; margin-bottom:8px">קטגוריה: ${esc(w.category)} · <button type="button" id="wizBackToCategoryBtn" style="border:none;background:none;color:#2563eb;cursor:pointer;font-size:13px;padding:0">שנה קטגוריה</button></div>`;
  const btnStyle = 'text-align:right; padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; cursor:pointer; font-size:15px;';
  const listStart = `<div style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px">`;

  if (w.category === "מזגן") {
    const ac = w.ac;
    if (!ac.issue) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">מה הבעיה?</div>${listStart}`;
      Object.keys(AC_ISSUES).forEach(key => {
        html += `<button type="button" class="wizBtn wizAcIssue" data-issue="${esc(key)}" style="${btnStyle}">${AC_ISSUES[key].icon} ${esc(key)}</button>`;
      });
      html += `</div>`;
      return html;
    }
    const conf = AC_ISSUES[ac.issue];
    if (conf.freeTextQuestion) {
      html += `
        <div class="light" style="font-size:14px; margin-bottom:6px">${esc(conf.freeTextQuestion)}</div>
        <input class="input" id="wizFreeText" value="${esc(ac.freeText)}" placeholder="${esc(conf.freeTextPlaceholder || "")}">
        <div style="display:flex; gap:8px; margin-top:8px">
          <button type="button" class="btn-dark-sm" id="wizConfirmFreeText">אישור</button>
          <button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>
        </div>
      `;
      return html;
    }
    if (!ac.followUp) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">${esc(conf.question)}</div>${listStart}`;
      conf.options.forEach(o => {
        const label = typeof o === "string" ? o : o.label;
        html += `<button type="button" class="wizBtn wizAcFollow" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;
    }
    const opt = conf.options.find(o => (typeof o === "string" ? o : o.label) === ac.followUp);
    if (opt && opt.followUp && !ac.followUp2) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">${esc(opt.followUp.question)}</div>${listStart}`;
      opt.followUp.options.forEach(label => {
        html += `<button type="button" class="wizBtn wizAcFollow2" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;
    }
  }

  if (w.category === "תאורה") {
    const l = w.light;
    if (!l.problem) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">מה הבעיה?</div>${listStart}`;
      LIGHT_PROBLEMS.forEach(label => {
        html += `<button type="button" class="wizBtn wizLightProblem" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div>`;
      return html;
    }
    if (l.problem === "אחר") {
      html += `
        <div class="light" style="font-size:14px; margin-bottom:6px">תאר את התקלה בקצרה</div>
        <input class="input" id="wizLightOtherText" value="${esc(l.otherText || "")}" placeholder="למשל: המנורה נופלת מהתושבת">
        <div style="display:flex; gap:8px; margin-top:8px">
          <button type="button" class="btn-dark-sm" id="wizConfirmLightOther">אישור</button>
          <button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>
        </div>
      `;
      return html;
    }
    if (!l.lampType) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">סוג המנורה</div>${listStart}`;
      LIGHT_TYPES.forEach(label => {
        html += `<button type="button" class="wizBtn wizLightType" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;
    }
    const needsColor = l.lampType === "נורת לד (LED)" || l.lampType === "פס לדים / ספוטים";
    if (needsColor && !l.color) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">גוון האור</div>${listStart}`;
      LIGHT_COLORS.forEach(label => {
        html += `<button type="button" class="wizBtn wizLightColor" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;
    }
  }

  return html;
}

function renderWizard() {
  const container = document.getElementById("wizardContainer");
  if (!container) return;
  container.innerHTML = wizardHtml();
  wireWizardEvents();
}

function wireWizardEvents() {
  document.querySelectorAll(".wizCategory").forEach(b => b.onclick = () => { state.wizard.category = b.dataset.cat; renderWizard(); });
  const backToCat = document.getElementById("wizBackToCategoryBtn");
  if (backToCat) backToCat.onclick = () => { resetWizard(); renderWizard(); };
  const resetBtn = document.getElementById("wizResetBtn");
  if (resetBtn) resetBtn.onclick = () => { resetWizard(); renderWizard(); };
  document.querySelectorAll(".wizAcIssue").forEach(b => b.onclick = () => { state.wizard.ac.issue = b.dataset.issue; renderWizard(); });
  document.querySelectorAll(".wizAcFollow").forEach(b => b.onclick = () => { state.wizard.ac.followUp = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizAcFollow2").forEach(b => b.onclick = () => { state.wizard.ac.followUp2 = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightProblem").forEach(b => b.onclick = () => { state.wizard.light.problem = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightType").forEach(b => b.onclick = () => { state.wizard.light.lampType = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightColor").forEach(b => b.onclick = () => { state.wizard.light.color = b.dataset.value; renderWizard(); });
  const freeTextInput = document.getElementById("wizFreeText");
  if (freeTextInput) freeTextInput.oninput = () => { state.wizard.ac.freeText = freeTextInput.value; };
  const confirmFreeText = document.getElementById("wizConfirmFreeText");
  if (confirmFreeText) confirmFreeText.onclick = () => {
    if (!state.wizard.ac.freeText.trim()) { alert("יש למלא את השדה"); return; }
    renderWizard();
  };
  const lightOtherInput = document.getElementById("wizLightOtherText");
  if (lightOtherInput) lightOtherInput.oninput = () => { state.wizard.light.otherText = lightOtherInput.value; };
  const confirmLightOther = document.getElementById("wizConfirmLightOther");
  if (confirmLightOther) confirmLightOther.onclick = () => {
    if (!state.wizard.light.otherText || !state.wizard.light.otherText.trim()) { alert("יש לתאר את התקלה"); return; }
    renderWizard();
  };
  const backBtn = document.getElementById("wizBackBtn");
  if (backBtn) backBtn.onclick = () => { goBackOneWizardStep(); renderWizard(); };
}

let state = {
  tab: "customer",
  currentUser: null,
  tickets: [],
  auditLog: [],
  users: [],
  auditFilter: "all",
  expandedAudit: null,
  loginError: "",
  sentNotice: false,
  loading: true,
  apiError: null,
  busy: false,
  wizard: null,
  editingDetailsTicketId: null,
};
state.wizard = blankWizard();

const STATUS_BADGE = { "פתוחה":"b-open", "משויכת":"b-assigned", "בטיפול":"b-progress", "סגורה":"b-closed", "נדחתה":"b-rejected" };

function findTicket(id) { return state.tickets.find(t => t.id === id); }

function rowToTicket(r) {
  return {
    id: r.id,
    ticketNumber: r.ticket_number,
    name: r.name || "", phone: r.phone || "", address: r.address || "", description: r.description || "",
    sku: r.sku || "", agent: r.agent || "", originalCustomer: r.original_customer || "",
    image: r.image || null,
    status: r.status,
    technician: r.technician || null,
    treatmentDate: r.treatment_date,
    createdAt: fmtDateTime(r.created_at),
    technicianNotes: r.technician_notes || "",
    technicianImage: r.technician_image || null,
  };
}
function rowToAudit(r) {
  return {
    id: r.id,
    ticketId: r.ticket_id,
    ticketNumber: r.ticket_number,
    performedBy: r.performed_by,
    changeType: r.change_type,
    oldValue: r.old_value,
    newValue: r.new_value,
    changedAt: fmtDateTime(r.changed_at),
  };
}

async function refreshState() {
  const [ticketsRes, auditRes, usersRes] = await Promise.all([
    sb.from("tickets").select("*").order("ticket_number", { ascending: false }),
    sb.from("audit_log").select("*").order("changed_at", { ascending: false }),
    sb.from("users").select("username,name,role,email"),
  ]);
  if (ticketsRes.error) throw ticketsRes.error;
  if (auditRes.error) throw auditRes.error;
  if (usersRes.error) throw usersRes.error;
  state.tickets = ticketsRes.data.map(rowToTicket);
  state.auditLog = auditRes.data.map(rowToAudit);
  state.users = usersRes.data;
}

async function initialLoad() {
  if (!sb) {
    state.apiError = sbInitError || "לא ניתן להתחבר ל-Supabase.";
    state.loading = false;
    render();
    return;
  }
  try {
    await refreshState();
    state.apiError = null;
  } catch (e) {
    state.apiError = "לא הצלחתי להתחבר למסד הנתונים. בדוק את ה-URL/המפתח ואת החיבור לאינטרנט. (" + (e.message || e) + ")";
  }
  state.loading = false;
  render();
}

async function apiLogin(username, password) {
  const { data, error } = await sb
    .from("users")
    .select("username,password,name,role,email")
    .ilike("username", username)
    .maybeSingle();
  if (error) throw error;
  if (data && String(data.password) === String(password)) {
    return { ok: true, user: { username: data.username, name: data.name, role: data.role } };
  }
  return { ok: false, error: "שם משתמש או סיסמה שגויים" };
}

async function submitTicket(form) {
  state.busy = true; render();
  try {
    const { data, error } = await sb.from("tickets").insert({
      name: form.name, phone: form.phone, address: form.address, description: form.description,
      sku: form.sku, agent: form.agent, original_customer: form.originalCustomer,
      image: form.image, status: "פתוחה",
    }).select().single();
    if (error) throw error;
    await refreshState();
    state.sentNotice = true;
    sendEmailNotification(
      EMAIL_CONFIG.MANAGER_EMAIL,
      "פנייה חדשה נפתחה " + fmtNum(data.ticket_number),
      "נפתחה פנייה חדשה מאת " + form.name + " (" + form.phone + ").\nתיאור: " + form.description
    );
  } catch (e) {
    alert("שגיאה בשליחת הפנייה: " + (e.message || e));
  }
  state.busy = false; render();
  setTimeout(() => { state.sentNotice = false; render(); }, 3500);
}

async function insertAudit(ticketId, ticketNumber, performedBy, changeType, oldValue, newValue) {
  await sb.from("audit_log").insert({
    ticket_id: ticketId, ticket_number: ticketNumber, performed_by: performedBy,
    change_type: changeType, old_value: oldValue, new_value: newValue,
  });
}

async function assignTicket(ticketId, technician, date, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const { error } = await sb.from("tickets").update({ technician, treatment_date: date, status: "משויכת" }).eq("id", ticketId);
    if (error) throw error;
    await insertAudit(ticketId, t.ticketNumber, managerName, "שיוך לטכנאי", "—", technician);
    await insertAudit(ticketId, t.ticketNumber, managerName, "תאריך טיפול", "—", date);
    await refreshState();
    sendEmailNotification(
      technicianEmail(technician),
      "שויכה אליך פנייה חדשה " + fmtNum(t.ticketNumber),
      "פנייה " + fmtNum(t.ticketNumber) + " שויכה אליך.\nלקוח: " + t.name + " (" + t.phone + ")\nתיאור: " + t.description + "\nתאריך טיפול: " + date
    );
  } catch (e) { alert("שגיאה בשיוך: " + (e.message || e)); }
  state.busy = false; render();
}

async function managerUpdateTicket(ticketId, date, status, technician, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    if (t.technician !== technician) await insertAudit(ticketId, t.ticketNumber, managerName, "החלפת טכנאי", t.technician || "—", technician);
    if (t.treatmentDate !== date) await insertAudit(ticketId, t.ticketNumber, managerName, "שינוי יום טיפול", t.treatmentDate || "—", date);
    if (t.status !== status) await insertAudit(ticketId, t.ticketNumber, managerName, "עדכון סטטוס", t.status, status);
    const { error } = await sb.from("tickets").update({ technician, treatment_date: date, status }).eq("id", ticketId);
    if (error) throw error;
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון: " + (e.message || e)); }
  state.busy = false; render();
}

const DETAIL_FIELD_LABELS = { name: "שם לקוח", phone: "טלפון", address: "כתובת", description: "תיאור תקלה", sku: 'מק"ט', agent: "סוכן", originalCustomer: "לקוח מקורי" };
const DETAIL_FIELD_DB_KEYS = { name: "name", phone: "phone", address: "address", description: "description", sku: "sku", agent: "agent", originalCustomer: "original_customer" };

async function managerUpdateDetails(ticketId, updates, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const dbUpdates = {};
    for (const key of Object.keys(updates)) {
      const oldVal = t[key] || "—";
      const newVal = updates[key] || "—";
      if (oldVal !== newVal) {
        await insertAudit(ticketId, t.ticketNumber, managerName, "עדכון " + DETAIL_FIELD_LABELS[key], oldVal, newVal);
        dbUpdates[DETAIL_FIELD_DB_KEYS[key]] = updates[key];
      }
    }
    if (Object.keys(dbUpdates).length) {
      const { error } = await sb.from("tickets").update(dbUpdates).eq("id", ticketId);
      if (error) throw error;
    }
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון פרטים: " + (e.message || e)); }
  state.editingDetailsTicketId = null;
  state.busy = false; render();
}

async function updateTicketByTech(ticketId, technicianName, date, status, notes, techImage) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    if (t.treatmentDate !== date) await insertAudit(ticketId, t.ticketNumber, technicianName, "שינוי יום טיפול", t.treatmentDate || "—", date);
    if (t.status !== status) await insertAudit(ticketId, t.ticketNumber, technicianName, "עדכון סטטוס", t.status, status);
    if ((t.technicianNotes || "") !== (notes || "")) await insertAudit(ticketId, t.ticketNumber, technicianName, "הערת טכנאי", t.technicianNotes || "—", notes || "—");
    const updates = { treatment_date: date, status, technician_notes: notes || "" };
    if (techImage) updates.technician_image = techImage;
    const { error } = await sb.from("tickets").update(updates).eq("id", ticketId);
    if (error) throw error;
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון: " + (e.message || e)); }
  state.busy = false; render();
}

function render() {
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;

  const app = document.getElementById("app");

  if (state.loading) {
    app.innerHTML = `<div style="min-height:400px; display:flex; align-items:center; justify-content:center; color:#94a3b8">טוען נתונים...</div>`;
    return;
  }

  if (state.apiError) {
    app.innerHTML = `
      <div style="max-width:480px; margin:60px auto; text-align:center; padding:0 20px">
        <div style="font-size:34px; margin-bottom:12px">⚠️</div>
        <h2 style="margin-bottom:8px">בעיית חיבור למסד הנתונים</h2>
        <p class="muted">${esc(state.apiError)}</p>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <header>
      <div class="brand">
        <div class="icon">🔧</div>
        <div><h1>מערכת ניהול תקלות</h1><p>לקוחות · מנהל לקוחות · טכנאים</p></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px">
        ${state.busy ? `<span class="light" style="font-size:14px">שומר...</span>` : ""}
        ${state.currentUser ? `<button class="logout-btn" id="logoutBtn">↩ ${esc(state.currentUser.name)} · התנתקות</button>` : ""}
      </div>
    </header>
    <nav>
      <button data-tab="customer" class="${state.tab==='customer'?'active':''}">👤 לקוח</button>
      <button data-tab="staff" class="${state.tab==='staff'?'active':''}">${state.currentUser ? (state.currentUser.role==='manager'?'🧑‍💼 מנהל לקוחות':'🔧 טכנאי') : '🔒 כניסת צוות'}</button>
    </nav>
    <main id="main"></main>
  `;
  document.querySelectorAll("nav button").forEach(b => b.onclick = async () => {
    state.tab = b.dataset.tab;
    if (state.tab === "staff" && state.currentUser) {
      state.loading = true; render();
      try { await refreshState(); } catch (e) {}
      state.loading = false;
    }
    render();
  });
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = () => { state.currentUser = null; render(); };

  const main = document.getElementById("main");
  if (state.tab === "customer") main.innerHTML = customerFormHtml();
  else if (state.tab === "staff" && !state.currentUser) main.innerHTML = loginHtml();
  else if (state.tab === "staff" && state.currentUser.role === "manager") main.innerHTML = managerHtml();
  else if (state.tab === "staff" && state.currentUser.role === "technician") main.innerHTML = technicianHtml();

  wireEvents();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selStart); } catch (e) {}
      }
    }
  }
}

function miniField(label, value) {
  return `<div><div class="light" style="font-size:11px; margin-bottom:2px">${esc(label)}</div><div style="font-size:15px; font-weight:600; color:#0f172a">${esc(value) || "—"}</div></div>`;
}

function waLink(phone, ticketNumber) {
  if (!phone) return null;
  let digits = String(phone).replace(/\D/g, "");
  if (!digits) return null;
  if (digits.startsWith("0")) digits = "972" + digits.slice(1);
  else if (!digits.startsWith("972")) digits = "972" + digits;
  const waMessage = "שלום,\nמדבר הטכנאי. אני בדרך אליך לטיפול בתקלה.\nאשמח אם תשלח לי את המיקום המדויק שלך (אפשר לשלוח מיקום ב-Waze), כדי שאוכל להגיע אליך בקלות.\nתודה!";
  const text = "?text=" + encodeURIComponent(waMessage);
  return "https://wa.me/" + digits + text;
}

function ticketFieldsBlock(t) {
  let html = `<div style="margin-bottom:10px"><div class="light" style="font-size:11px; margin-bottom:2px">תיאור התקלה</div><div style="font-size:16px">${esc(t.description)}</div></div>`;
  if (t.sku || t.agent || t.originalCustomer) {
    html += `<div style="display:flex; flex-wrap:wrap; gap:14px 24px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #f1f5f9">`;
    if (t.sku) html += miniField('מק"ט', t.sku);
    if (t.agent) html += miniField("סוכן", t.agent);
    if (t.originalCustomer) html += miniField("לקוח מקורי", t.originalCustomer);
    html += `</div>`;
  }
  if (t.image) html += `<img class="thumb" src="${t.image}" alt="תמונת התקלה">`;
  if (t.technicianNotes || t.technicianImage) {
    html += `<div style="margin-top:4px; margin-bottom:8px; padding:8px; background:#f8fafc; border-radius:8px">`;
    html += `<div class="light" style="font-size:13px; margin-bottom:4px">הערות טכנאי:</div>`;
    if (t.technicianNotes) html += `<div style="font-size:15px; margin-bottom:6px">${esc(t.technicianNotes)}</div>`;
    if (t.technicianImage) html += `<img class="thumb" src="${t.technicianImage}" alt="תמונת טכנאי" style="margin-bottom:0">`;
    html += `</div>`;
  }
  return html;
}

function cardHeader(t) {

        : `<span style="font-size:15px; font-weight:600; color:#0f172a">${esc(t.phone)}</span>`)
    : `<span style="font-size:15px; font-weight:600; color:#0f172a">—</span>`;
  return `
    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px; padding-bottom:10px; border-bottom:1px solid #f1f5f9">

    </div>
  `;
}

function managerHtml() {
  const open = state.tickets.filter(t => t.status === "פתוחה");
  const technicians = state.users.filter(u => u.role === "technician");
  const mTab = state.managerTab || "open";

  const search = (state.allSearch || "").trim().toLowerCase();
  const statusFilter = state.allStatusFilter || "all";
  let all = state.tickets;
  if (statusFilter !== "all") all = all.filter(t => t.status === statusFilter);
  if (search) {
    all = all.filter(t => {
      const hay = [fmtNum(t.ticketNumber), t.name, t.phone, t.description, t.sku, t.agent, t.address].join(" ").toLowerCase();
      return hay.includes(search);
    });
  }

  let body = "";
  if (mTab === "open") {
    body = open.length === 0 ? `<div class="empty">אין פניות פתוחות ממתינות לשיוך.</div>` :
      open.map(t => assignCardHtml(t, technicians)).join("");
  } else if (mTab === "all") {
    body = `
      <div class="row" style="margin-bottom:14px">
        <label style="flex:1; min-width:200px"><span class="label">🔍 חיפוש (שם, טלפון, מק"ט, תיאור...)</span><input type="text" id="allSearchInput" value="${esc(state.allSearch||'')}" placeholder="חיפוש פנייה..."></label>
        <label><span class="label">סינון לפי סטטוס</span>
          <select id="allStatusSelect">
            <option value="all" ${statusFilter==='all'?'selected':''}>הכל</option>
            <option value="פתוחה" ${statusFilter==='פתוחה'?'selected':''}>פתוחה</option>
            <option value="משויכת" ${statusFilter==='משויכת'?'selected':''}>משויכת</option>
            <option value="בטיפול" ${statusFilter==='בטיפול'?'selected':''}>בטיפול</option>
            <option value="סגורה" ${statusFilter==='סגורה'?'selected':''}>סגורה</option>
            <option value="נדחתה" ${statusFilter==='נדחתה'?'selected':''}>נדחתה</option>
          </select>
        </label>
      </div>
      ${all.length === 0 ? `<div class="empty">לא נמצאו פניות תואמות.</div>` : all.map(t => allTicketCardHtml(t, technicians)).join("")}
    `;
  } else if (mTab === "log") {
    body = auditTableHtml();
  }

  return `
    <div class="pill-row">
      <button class="pill ${mTab==='open'?'active':''}" data-mtab="open">📋 פניות פתוחות (${open.length})</button>
      <button class="pill ${mTab==='all'?'active':''}" data-mtab="all">🔧 כל הפניות (${state.tickets.length})</button>
      <button class="pill ${mTab==='log'?'active':''}" data-mtab="log">🕘 יומן שינויים</button>
      <button class="pill" id="refreshBtn" style="margin-right:auto">🔄 רענון</button>
    </div>
    <div>${body}</div>
  `;
}

function assignCardHtml(t, technicians) {
  const techOptions = technicians.map(n => `<option value="${esc(n.name)}">${esc(n.name)}</option>`).join("");
  return `
    <div class="card" data-assign="${t.id}">
      ${cardHeader(t)}
      ${ticketFieldsBlock(t)}
      <div class="row">
        <label><span class="label">טכנאי</span><select class="assignTech">${techOptions}</select></label>
        <label><span class="label">תאריך טיפול</span><input type="date" class="assignDate" value="${todayISO()}"></label>
        <button class="btn-amber assignBtn">שיוך</button>
      </div>
    </div>
  `;
}

function editDetailsFormHtml(t) {
  return `
    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:12px; margin-bottom:10px">
      <div class="grid2">
        <label class="field"><span class="label">שם לקוח</span><input class="input editName" value="${esc(t.name)}"></label>
        <label class="field"><span class="label">טלפון</span><input class="input editPhone" value="${esc(t.phone)}"></label>
      </div>
      <label class="field"><span class="label">כתובת</span><input class="input editAddress" value="${esc(t.address)}"></label>
      <label class="field"><span class="label">תיאור התקלה</span><textarea class="input editDescription">${esc(t.description)}</textarea></label>
      <div class="grid2">
        <label class="field"><span class="label">מק"ט</span><input class="input editSku" value="${esc(t.sku)}"></label>
        <label class="field"><span class="label">סוכן</span><input class="input editAgent" value="${esc(t.agent)}"></label>
      </div>
      <label class="field"><span class="label">לקוח מקורי</span><input class="input editOriginal" value="${esc(t.originalCustomer)}"></label>
      <div style="display:flex; gap:8px; margin-top:4px">
        <button type="button" class="btn-dark-sm saveDetailsBtn" data-id="${t.id}">💾 שמירת פרטים</button>
        <button type="button" class="btn-dark-sm cancelEditBtn" style="background:#f1f5f9; color:#334155">ביטול</button>
      </div>
    </div>
  `;
}

function allTicketCardHtml(t, technicians) {
  const canEdit = !!t.technician;
  const isEditing = state.editingDetailsTicketId === t.id;
  const techOptions = technicians.map(n => `<option value="${esc(n.name)}" ${t.technician===n.name?'selected':''}>${esc(n.name)}</option>`).join("");

  if (isEditing) {
    return `<div class="card" data-ticket="${t.id}">${editDetailsFormHtml(t)}</div>`;
  }

  return `
    <div class="card" data-ticket="${t.id}">
      ${cardHeader(t)}
      ${ticketFieldsBlock(t)}
      <button type="button" class="btn-dark-sm editDetailsToggle" data-id="${t.id}" style="background:#f1f5f9; color:#334155; margin-bottom:8px">✏️ עריכת פרטי פנייה</button>
      <div class="muted" style="display:flex; flex-wrap:wrap; gap:16px; margin-bottom:${canEdit?'8':'0'}px">
        <span>נפתחה: ${esc(t.createdAt)}</span>
      </div>
      ${canEdit ? `
        <div class="row">
          <label><span class="label">טכנאי</span><select class="mgrTech">${techOptions}</select></label>
          <label><span class="label">📅 תאריך טיפול</span><input type="date" class="mgrDate" value="${t.treatmentDate||todayISO()}"></label>
          <label><span class="label">סטטוס</span>
            <select class="mgrStatus">
              <option value="משויכת" ${t.status==='משויכת'?'selected':''}>משויכת</option>
              <option value="בטיפול" ${t.status==='בטיפול'?'selected':''}>בטיפול</option>
              <option value="סגורה" ${t.status==='סגורה'?'selected':''}>סגורה</option>
              <option value="נדחתה" ${t.status==='נדחתה'?'selected':''}>נדחתה</option>
            </select>
          </label>
          <button class="btn-dark-sm mgrUpdateBtn">עדכון</button>
        </div>` : ""}
    </div>
  `;
}

function auditTableHtml() {
  if (state.auditLog.length === 0) return `<div class="empty">עדיין אין שינויים מתועדים.</div>`;
  const nums = [...new Set(state.auditLog.map(a=>a.ticketNumber))].sort((a,b)=>a-b);
  const orderSearch = (state.auditSearch || "").trim().replace(/^#/, "");
  let filtered = state.auditFilter === "all" ? state.auditLog : state.auditLog.filter(a => a.ticketNumber === Number(state.auditFilter));
  if (orderSearch) filtered = filtered.filter(a => String(a.ticketNumber).includes(orderSearch) || fmtNum(a.ticketNumber).includes(orderSearch));
  const sorted = [...filtered].sort((a,b) => a.ticketNumber - b.ticketNumber);

  const rows = sorted.map(a => {
    const t = findTicket(a.ticketId);
    const isOpen = state.expandedAudit === a.id;
    let rowHtml = `
      <tr data-audit="${a.id}">
        <td style="font-weight:600">${fmtNum(a.ticketNumber)}</td>
        <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis" title="${esc(t?.description)}">${esc(t?.description)||"—"}</td>
        <td style="font-weight:500">${esc(a.performedBy)}</td>
        <td>${esc(a.changeType)}</td>
        <td class="light">${esc(a.oldValue)}</td>
        <td>${esc(a.newValue)}</td>
        <td class="light">${esc(a.changedAt)}</td>
      </tr>
    `;
    if (isOpen && t) {
      rowHtml += `
        <tr class="detail-row" style="background:#f8fafc">
          <td colspan="7">
            <div class="detail-grid">
              <div><span class="light">שם לקוח: </span>${esc(t.name)}</div>
              <div><span class="light">טלפון: </span>${esc(t.phone)}</div>
              <div><span class="light">כתובת: </span>${esc(t.address)||"—"}</div>
              <div><span class="light">תיאור: </span>${esc(t.description)}</div>
              <div><span class="light">סטטוס: </span>${esc(t.status)}</div>
              <div><span class="light">טכנאי: </span>${esc(t.technician)||"—"}</div>
              <div><span class="light">תאריך טיפול: </span>${esc(t.treatmentDate)||"—"}</div>
              <div><span class="light">נפתחה: </span>${esc(t.createdAt)}</div>
              <div><span class="light">מק"ט: </span>${esc(t.sku)||"—"}</div>
              <div><span class="light">סוכן: </span>${esc(t.agent)||"—"}</div>
              <div><span class="light">לקוח מקורי: </span>${esc(t.originalCustomer)||"—"}</div>
            </div>
            ${t.image ? `<img class="thumb" style="margin-top:8px" src="${t.image}">` : ""}
          </td>
        </tr>
      `;
    }
    return rowHtml;
  }).join("");

  return `
    <div class="row" style="margin-bottom:8px">
      <label style="flex:1; min-width:200px"><span class="label">🔍 חיפוש לפי מספר הזמנה</span><input type="text" id="auditSearchInput" value="${esc(state.auditSearch||'')}" placeholder="לדוגמה: 0007 או 7"></label>
      <label><span class="label">סינון לפי מספר פנייה</span>
        <select id="auditFilterSel">
          <option value="all" ${state.auditFilter==='all'?'selected':''}>הכל</option>
          ${nums.map(n => `<option value="${n}" ${state.auditFilter==String(n)?'selected':''}>${fmtNum(n)}</option>`).join("")}
        </select>
      </label>
    </div>
    <p class="light" style="font-size:14px; margin-bottom:8px">לחצו על שורה כדי לראות את כל פרטי הפנייה.</p>
    <div class="card" style="padding:0; overflow:hidden">
      <table>
        <thead><tr><th>פנייה #</th><th>פרטי תקלה</th><th>בוצע על ידי</th><th>סוג שינוי</th><th>מ</th><th>ל</th><th>מתי</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function technicianHtml() {
  const all = state.tickets.filter(t => t.technician === state.currentUser.name);
  const refreshBar = `<div class="pill-row"><button class="pill" id="refreshBtn">🔄 רענון</button></div>`;
  if (all.length === 0) return refreshBar + `<div class="empty">אין פניות משויכות אליך כרגע.</div>`;

  const statusFilter = state.techStatusFilter || "all";
  const dateFilter = state.techDateFilter || "";
  let mine = all;
  if (statusFilter !== "all") mine = mine.filter(t => t.status === statusFilter);
  if (dateFilter) mine = mine.filter(t => t.treatmentDate === dateFilter);

  const filterBar = `
    <div class="row" style="margin-bottom:14px">
      <label><span class="label">סינון לפי סטטוס</span>
        <select id="techStatusSelect">
          <option value="all" ${statusFilter==='all'?'selected':''}>הכל</option>
          <option value="משויכת" ${statusFilter==='משויכת'?'selected':''}>משויכת</option>
          <option value="בטיפול" ${statusFilter==='בטיפול'?'selected':''}>בטיפול</option>
          <option value="סגורה" ${statusFilter==='סגורה'?'selected':''}>סגורה</option>
          <option value="נדחתה" ${statusFilter==='נדחתה'?'selected':''}>נדחתה</option>
        </select>
      </label>
      <label><span class="label">סינון לפי תאריך טיפול</span><input type="date" id="techDateFilterInput" value="${dateFilter}"></label>
      ${(statusFilter!=='all' || dateFilter) ? `<button class="btn-dark-sm" id="techFilterClear">נקה סינון</button>` : ""}
    </div>
  `;

  const cards = mine.length === 0
    ? `<div class="empty">לא נמצאו פניות תואמות לסינון.</div>`
    : mine.map(t => `
    <div class="card" data-tech="${t.id}">
      ${cardHeader(t)}
      ${ticketFieldsBlock(t)}
      <div class="light" style="font-size:14px; margin-bottom:8px">נפתחה: ${esc(t.createdAt)}</div>
      <div class="row" style="margin-bottom:10px">
        <label><span class="label">⏱ יום טיפול</span><input type="date" class="techDate" value="${t.treatmentDate||todayISO()}"></label>
        <label><span class="label">סטטוס</span>
          <select class="techStatus">
            <option value="משויכת" ${t.status==='משויכת'?'selected':''}>משויכת</option>
            <option value="בטיפול" ${t.status==='בטיפול'?'selected':''}>בטיפול</option>
            <option value="סגורה" ${t.status==='סגורה'?'selected':''}>סגורה</option>
            <option value="נדחתה" ${t.status==='נדחתה'?'selected':''}>דחייה</option>
          </select>
        </label>
      </div>
      <label class="field"><span class="label">הערות</span><textarea class="techNotes" placeholder="הערות טיפול...">${esc(t.technicianNotes||"")}</textarea></label>
      <label class="field">
        <span class="label">צירוף תמונה</span>
        <input type="file" accept="image/*" class="techImageInput">
        <div class="techImgPreview">${t.technicianImage ? `<img class="thumb" style="margin-top:8px" src="${t.technicianImage}">` : ""}</div>
      </label>
      <button class="btn-dark-sm techSaveBtn">שמירת שינוי</button>
    </div>
  `).join("");

  return refreshBar + filterBar + cards;
}

let pendingImage = null;

function wireEvents() {
  // Customer form
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    document.getElementById("f_image").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (reader.result.length > 2000000) {
          alert("התמונה גדולה מדי. נסה תמונה קטנה/דחוסה יותר (עד כ-1.5MB).");
          e.target.value = "";
          return;
        }
        pendingImage = reader.result;
        document.getElementById("imgPreview").innerHTML = `<img class="thumb" style="margin-top:8px" src="${pendingImage}">`;
      };
      reader.readAsDataURL(file);
    };
    wireWizardEvents();
    submitBtn.onclick = () => {
      const name = document.getElementById("f_name").value.trim();
      const phone = document.getElementById("f_phone").value.trim();
      const address = document.getElementById("f_address").value.trim();
      const originalCustomer = document.getElementById("f_original").value.trim();
      const extraNotes = document.getElementById("f_extra_notes").value.trim();
      const composedDesc = getComposedDescription();
      if (!composedDesc) {
        alert("יש להשלים את תיאור התקלה (לבחור קטגוריה ולענות על השאלות) לפני השליחה.");
        return;
      }
      if (!name || !phone || !address || !originalCustomer) {
        alert("יש למלא שם, טלפון, כתובת, ולקוח מקורי — שדות אלו חובה.");
        return;
      }
      const description = composedDesc + (extraNotes ? " | הערות: " + extraNotes : "");
      const img = pendingImage;
      pendingImage = null;
      resetWizard();
      submitTicket({
        name, phone, address, description, originalCustomer,
        sku: document.getElementById("f_sku").value.trim(),
        agent: document.getElementById("f_agent").value.trim(),
        image: img,
      });
    };
  }

  // Login
  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn) {
    const tryLogin = async () => {
      const u = document.getElementById("l_username").value.trim();
      const p = document.getElementById("l_password").value;
      loginBtn.disabled = true;
      loginBtn.textContent = "מתחבר...";
      try {
        const res = await apiLogin(u, p);
        if (res.ok) { state.currentUser = res.user; state.loginError = ""; }
        else { state.loginError = res.error || "שם משתמש או סיסמה שגויים"; }
      } catch (e) {
        state.loginError = "שגיאת תקשורת עם השרת — נסה שוב";
      }
      render();
    };
    loginBtn.onclick = tryLogin;
    ["l_username","l_password"].forEach(id => {
      document.getElementById(id).onkeydown = (e) => { if (e.key === "Enter") tryLogin(); };
    });
  }

  // Manager tabs
  document.querySelectorAll("[data-mtab]").forEach(b => b.onclick = () => { state.managerTab = b.dataset.mtab; render(); });

  // Manual refresh
  const refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.onclick = async () => {
    state.loading = true; render();
    try { await refreshState(); } catch (e) {}
    state.loading = false;
    render();
  };

  // All-tickets search & status filter
  const allSearchInput = document.getElementById("allSearchInput");
  if (allSearchInput) allSearchInput.oninput = () => { state.allSearch = allSearchInput.value; render(); };
  const allStatusSelect = document.getElementById("allStatusSelect");
  if (allStatusSelect) allStatusSelect.onchange = () => { state.allStatusFilter = allStatusSelect.value; render(); };

  // Assign
  document.querySelectorAll("[data-assign]").forEach(card => {
    const id = card.dataset.assign;
    card.querySelector(".assignBtn").onclick = () => {
      const tech = card.querySelector(".assignTech").value;
      const date = card.querySelector(".assignDate").value;
      assignTicket(id, tech, date, state.currentUser.name);
    };
  });

  // Edit ticket details (all tab)
  document.querySelectorAll(".editDetailsToggle").forEach(b => b.onclick = () => { state.editingDetailsTicketId = b.dataset.id; render(); });
  document.querySelectorAll(".cancelEditBtn").forEach(b => b.onclick = () => { state.editingDetailsTicketId = null; render(); });
  document.querySelectorAll(".saveDetailsBtn").forEach(b => {
    b.onclick = () => {
      const card = b.closest(".card");
      const updates = {
        name: card.querySelector(".editName").value.trim(),
        phone: card.querySelector(".editPhone").value.trim(),
        address: card.querySelector(".editAddress").value.trim(),
        description: card.querySelector(".editDescription").value.trim(),
        sku: card.querySelector(".editSku").value.trim(),
        agent: card.querySelector(".editAgent").value.trim(),
        originalCustomer: card.querySelector(".editOriginal").value.trim(),
      };
      if (!updates.name || !updates.phone || !updates.address || !updates.description || !updates.originalCustomer) {
        alert("שם, טלפון, כתובת, תיאור התקלה, ולקוח מקורי הם שדות חובה.");
        return;
      }
      managerUpdateDetails(b.dataset.id, updates, state.currentUser.name);
    };
  });

  // Manager date+status+technician change (all tab)
  document.querySelectorAll("[data-ticket]").forEach(card => {
    const btn = card.querySelector(".mgrUpdateBtn");
    if (!btn) return;
    const dateInput = card.querySelector(".mgrDate");
    const statusSelect = card.querySelector(".mgrStatus");
    const techSelect = card.querySelector(".mgrTech");
    btn.onclick = () => {
      managerUpdateTicket(card.dataset.ticket, dateInput.value, statusSelect.value, techSelect.value, state.currentUser.name);
    };
  });

  // Audit filter + search + row expand
  const auditSel = document.getElementById("auditFilterSel");
  if (auditSel) auditSel.onchange = () => { state.auditFilter = auditSel.value; render(); };
  const auditSearchInput = document.getElementById("auditSearchInput");
  if (auditSearchInput) auditSearchInput.oninput = () => { state.auditSearch = auditSearchInput.value; render(); };
  document.querySelectorAll("tr[data-audit]").forEach(tr => {
    tr.onclick = () => {
      const id = tr.dataset.audit;
      state.expandedAudit = state.expandedAudit === id ? null : id;
      render();
    };
  });

  // Technician filters
  const techStatusSelect = document.getElementById("techStatusSelect");
  if (techStatusSelect) techStatusSelect.onchange = () => { state.techStatusFilter = techStatusSelect.value; render(); };
  const techDateFilterInput = document.getElementById("techDateFilterInput");
  if (techDateFilterInput) techDateFilterInput.onchange = () => { state.techDateFilter = techDateFilterInput.value; render(); };
  const techFilterClear = document.getElementById("techFilterClear");
  if (techFilterClear) techFilterClear.onclick = () => { state.techStatusFilter = "all"; state.techDateFilter = ""; render(); };

  // Technician
  document.querySelectorAll("[data-tech]").forEach(card => {
    const id = card.dataset.tech;
    let pendingTechImage = null;
    const imgInput = card.querySelector(".techImageInput");
    if (imgInput) {
      imgInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (reader.result.length > 2000000) {
            alert("התמונה גדולה מדי. נסה תמונה קטנה/דחוסה יותר (עד כ-1.5MB).");
            e.target.value = "";
            return;
          }
          pendingTechImage = reader.result;
          card.querySelector(".techImgPreview").innerHTML = `<img class="thumb" style="margin-top:8px" src="${pendingTechImage}">`;
        };
        reader.readAsDataURL(file);
      };
    }
    const btn = card.querySelector(".techSaveBtn");
    btn.onclick = () => {
      const date = card.querySelector(".techDate").value;
      const status = card.querySelector(".techStatus").value;
      const notes = card.querySelector(".techNotes").value;
      updateTicketByTech(id, state.currentUser.name, date, status, notes, pendingTechImage);
    };
  });
}

window.addEventListener("error", (e) => {
  const app = document.getElementById("app");
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = `
      <div style="max-width:480px; margin:60px auto; text-align:center; padding:0 20px; font-family:sans-serif">
        <div style="font-size:34px; margin-bottom:12px">⚠️</div>
        <h2>שגיאה בטעינת האפליקציה</h2>
        <p style="color:#64748b">${(e.message || e.error || "שגיאה לא ידועה").toString()}</p>
      </div>
    `;
  }
});

initialLoad();
</script>
</body>
</html>
