    --light: #98a2b3;

    --danger: #dc2626;

  body {

<script>

/* ============================================================
   הגדרת שליחת מיילים (EmailJS)
   ============================================================
   1. הירשם בחינם ב-emailjs.com
   2. Email Services -> Add New Service -> חבר את ה-Gmail שלך -> תעתיק Service ID
   3. Email Templates -> Create New Template -> תשתמש במשתנים {{to_email}} {{subject}} {{message}} -> תעתיק Template ID
   4. Account -> General -> Public Key -> תעתיק אותו
   5. תדביק את שלושתם למטה, תמלא MANAGER_EMAIL, ותשנה ENABLED ל-true
   ============================================================ */
const EMAIL_CONFIG = {
  ENABLED: true,
  PUBLIC_KEY: "Cy4csv4_eP_qJU191",
  SERVICE_ID: "service_3bssnwn",
  TEMPLATE_ID: "template_prfo4ky",

};
if (EMAIL_CONFIG.ENABLED && typeof emailjs !== "undefined") {
  try { emailjs.init(EMAIL_CONFIG.PUBLIC_KEY); } catch (e) { console.error("EmailJS init failed:", e); }
}
function sendEmailNotification(toEmail, subject, message) {
  if (!EMAIL_CONFIG.ENABLED || !toEmail || typeof emailjs === "undefined") return;
  emailjs.send(EMAIL_CONFIG.SERVICE_ID, EMAIL_CONFIG.TEMPLATE_ID, {
    to_email: toEmail, subject: subject, message: message,
  }).catch(err => console.error("שליחת מייל נכשלה:", err));
}
function technicianEmail(name) {
  const u = state.users.find(x => x.role === "technician" && x.name === name);
  return u ? u.email : null;
}
function managerEmails() {
  const emails = state.users.filter(u => u.role === "manager" && u.email && u.email.trim()).map(u => u.email);
  return emails.length ? emails : (EMAIL_CONFIG.MANAGER_EMAIL && !EMAIL_CONFIG.MANAGER_EMAIL.includes("PASTE") ? [EMAIL_CONFIG.MANAGER_EMAIL] : []);
}

function nowStr() {
  return new Date().toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" });
}
function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" });
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtNum(n) { return "#" + String(n).padStart(4, "0"); }
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toCSVValue(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportTicketsCSV(tickets) {
  const headers = ["מספר פנייה","סטטוס","שם לקוח","טלפון","עיר","כתובת","תיאור","מק\"ט","סוכן","לקוח סופי","טכנאי","תאריך טיפול","נפתחה","הערת טכנאי","הערת סוכן","הערת מנהל"];
  const rows = tickets.map(t => [
    fmtNum(t.ticketNumber), t.status, t.name, t.phone, t.city || "", t.address, t.description,
    t.sku || "", t.agent || "", t.originalCustomer, t.technician || "", t.treatmentDate || "",
    t.createdAt, t.technicianNotes || "", t.agentNotes || "", t.managerNotes || "",
  ]);
  const csv = "\uFEFF" + [headers, ...rows].map(r => r.map(toCSVValue).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "פניות_" + todayISO() + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const CITIES = ["אום אל-פחם", "אופקים", "אור יהודה", "אור עקיבא", "אילת", "אלעד", "אריאל", "אשדוד", "אשקלון", "באקה אל-גרבייה", "באר שבע", "בית שאן", "בית שמש", "ביתר עילית", "בני ברק", "בת ים", "גבעת שמואל", "גבעתיים", "דימונה", "הוד השרון", "הרצליה", "חדרה", "חולון", "חיפה", "טבריה", "טייבה", "טירה", "טירת כרמל", "טמרה", "יבנה", "יהוד-מונוסון", "יקנעם עילית", "ירושלים", "כפר יונה", "כפר סבא", "כפר קאסם", "כרמיאל", "לוד", "מגדל העמק", "מודיעין-מכבים-רעות", "מודיעין עילית", "מעלה אדומים", "מעלות-תרשיחא", "נהריה", "נוף הגליל", "נס ציונה", "נצרת", "נשר", "נתיבות", "נתניה", "סח'נין", "עכו", "עפולה", "עראבה", "ערד", "פתח תקווה", "צפת", "קלנסווה", "קריית אונו", "קריית אתא", "קריית ביאליק", "קריית גת", "קריית ים", "קריית מוצקין", "קריית מלאכי", "קריית שמונה", "ראש העין", "ראשון לציון", "רהט", "רחובות", "רמלה", "רמת גן", "רמת השרון", "רעננה", "שדרות", "שפרעם", "תל אביב-יפו", "אחר"];

function blankWizard() {
  return {
    category: null,
    ac: { issue: null, followUp: null, followUp2: null, freeText: "" },
    light: { problem: null, lampType: null, color: null, otherText: "" },
  };
}
function resetWizard() { state.wizard = blankWizard(); }

function composeACDescription() {
  const ac = state.wizard.ac;
  if (!ac.issue) return null;
  const conf = AC_ISSUES[ac.issue];
  const parts = ["מזגן", ac.issue];
  if (conf.freeTextQuestion) {
    if (!ac.freeText.trim()) return null;
    parts.push("קוד תקלה: " + ac.freeText.trim());
    return parts.join(" — ");
  }
  if (!ac.followUp) return null;
  parts.push(ac.followUp);
  const opt = conf.options.find(o => (typeof o === "string" ? o : o.label) === ac.followUp);
  if (opt && opt.followUp) {
    if (!ac.followUp2) return null;
    parts.push(ac.followUp2);
  }
  return parts.join(" — ");
}
function composeLightDescription() {
  const l = state.wizard.light;
  if (!l.problem) return null;
  if (l.problem === "אחר") {
    if (!l.otherText || !l.otherText.trim()) return null;
    return "תאורה — אחר — " + l.otherText.trim();
  }
  const parts = ["תאורה", l.problem];
  if (!l.lampType) return null;
  parts.push("סוג: " + l.lampType);
  const needsColor = l.lampType === "נורת לד (LED)" || l.lampType === "פס לדים / ספוטים";
  if (needsColor) {
    if (!l.color) return null;
    parts.push("גוון: " + l.color);
  }
  return parts.join(" — ");
}
function getComposedDescription() {
  if (state.wizard.category === "מזגן") return composeACDescription();
  if (state.wizard.category === "תאורה") return composeLightDescription();
  return null;
}

function goBackOneWizardStep() {
  const w = state.wizard;
  if (w.category === "מזגן") {
    const ac = w.ac;
    const conf = ac.issue ? AC_ISSUES[ac.issue] : null;
    if (conf && conf.freeTextQuestion) { ac.issue = null; ac.freeText = ""; return; }
    if (ac.followUp2) { ac.followUp2 = null; return; }
    if (ac.followUp) { ac.followUp = null; return; }
    if (ac.issue) { ac.issue = null; return; }
  }
  if (w.category === "תאורה") {
    const l = w.light;
    if (l.problem === "אחר") { l.problem = null; l.otherText = ""; return; }
    if (l.color) { l.color = null; return; }
    if (l.lampType) { l.lampType = null; return; }
    if (l.problem) { l.problem = null; return; }
  }
}

      });

    }
    const conf = AC_ISSUES[ac.issue];
    if (conf.freeTextQuestion) {
      html += `

          <button type="button" class="btn-dark-sm" id="wizConfirmFreeText">אישור</button>

      `;

    }
    if (!ac.followUp) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">${esc(conf.question)}</div>${listStart}`;
      conf.options.forEach(o => {
        const label = typeof o === "string" ? o : o.label;
        html += `<button type="button" class="wizBtn wizAcFollow" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;
    }
    const opt = conf.options.find(o => (typeof o === "string" ? o : o.label) === ac.followUp);
    if (opt && opt.followUp && !ac.followUp2) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">${esc(opt.followUp.question)}</div>${listStart}`;

    if (needsColor && !l.color) {
      html += `<div class="light" style="font-size:14px; margin-bottom:8px">גוון האור</div>${listStart}`;
      LIGHT_COLORS.forEach(label => {
        html += `<button type="button" class="wizBtn wizLightColor" data-value="${esc(label)}" style="${btnStyle}">${esc(label)}</button>`;
      });
      html += `</div><button type="button" class="btn-dark-sm" id="wizBackBtn" style="background:#f1f5f9; color:#334155">🔙 חזרה</button>`;
      return html;

  return html;
}

function renderWizard() {
  const container = document.getElementById("wizardContainer");
  if (!container) return;
  container.innerHTML = wizardHtml();
  wireWizardEvents();
}

function wireWizardEvents() {
  document.querySelectorAll(".wizCategory").forEach(b => b.onclick = () => { state.wizard.category = b.dataset.cat; renderWizard(); });
  const backToCat = document.getElementById("wizBackToCategoryBtn");
  if (backToCat) backToCat.onclick = () => { resetWizard(); renderWizard(); };
  const resetBtn = document.getElementById("wizResetBtn");
  if (resetBtn) resetBtn.onclick = () => { resetWizard(); renderWizard(); };
  document.querySelectorAll(".wizAcIssue").forEach(b => b.onclick = () => { state.wizard.ac.issue = b.dataset.issue; renderWizard(); });
  document.querySelectorAll(".wizAcFollow").forEach(b => b.onclick = () => { state.wizard.ac.followUp = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizAcFollow2").forEach(b => b.onclick = () => { state.wizard.ac.followUp2 = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightProblem").forEach(b => b.onclick = () => { state.wizard.light.problem = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightType").forEach(b => b.onclick = () => { state.wizard.light.lampType = b.dataset.value; renderWizard(); });
  document.querySelectorAll(".wizLightColor").forEach(b => b.onclick = () => { state.wizard.light.color = b.dataset.value; renderWizard(); });
  const freeTextInput = document.getElementById("wizFreeText");
  if (freeTextInput) freeTextInput.oninput = () => { state.wizard.ac.freeText = freeTextInput.value; };
  const confirmFreeText = document.getElementById("wizConfirmFreeText");
  if (confirmFreeText) confirmFreeText.onclick = () => {
    if (!state.wizard.ac.freeText.trim()) { alert("יש למלא את השדה"); return; }
    renderWizard();
  };
  const lightOtherInput = document.getElementById("wizLightOtherText");
  if (lightOtherInput) lightOtherInput.oninput = () => { state.wizard.light.otherText = lightOtherInput.value; };
  const confirmLightOther = document.getElementById("wizConfirmLightOther");
  if (confirmLightOther) confirmLightOther.onclick = () => {
    if (!state.wizard.light.otherText || !state.wizard.light.otherText.trim()) { alert("יש לתאר את התקלה"); return; }
    renderWizard();
  };
  const backBtn = document.getElementById("wizBackBtn");
  if (backBtn) backBtn.onclick = () => { goBackOneWizardStep(); renderWizard(); };
}

  expandedTicketAuditId: null,
};

const STATUS_BADGE = { "פתוחה":"b-open", "משויכת":"b-assigned", "בטיפול":"b-progress", "סגורה":"b-closed", "נדחתה":"b-rejected" };

function findTicket(id) { return state.tickets.find(t => t.id === id); }

function rowToTicket(r) {
  return {
    id: r.id,
    ticketNumber: r.ticket_number,
    name: r.name || "", phone: r.phone || "", address: r.address || "", city: r.city || "", description: r.description || "",
    sku: r.sku || "", agent: r.agent || "", originalCustomer: r.original_customer || "",
    image: r.image || null,
    status: r.status,
    technician: r.technician || null,
    treatmentDate: r.treatment_date,
    createdAt: fmtDateTime(r.created_at),

    technicianImage: r.technician_image || null,

}
function rowToAudit(r) {
  return {
    id: r.id,
    ticketId: r.ticket_id,
    ticketNumber: r.ticket_number,
    performedBy: r.performed_by,
    changeType: r.change_type,
    oldValue: r.old_value,
    newValue: r.new_value,
    changedAt: fmtDateTime(r.changed_at),
  };

async function refreshState() {
  const [ticketsRes, auditRes, usersRes] = await Promise.all([
    sb.from("tickets").select("*").order("ticket_number", { ascending: false }),
    sb.from("audit_log").select("*").order("changed_at", { ascending: false }),
    sb.from("users").select("username,name,role,email"),
  ]);
  if (ticketsRes.error) throw ticketsRes.error;
  if (auditRes.error) throw auditRes.error;
  if (usersRes.error) throw usersRes.error;
  state.tickets = ticketsRes.data.map(rowToTicket);
  state.auditLog = auditRes.data.map(rowToAudit);
  state.users = usersRes.data;
}

async function initialLoad() {
  if (!sb) {
    state.apiError = sbInitError || "לא ניתן להתחבר ל-Supabase.";
    state.loading = false;
    render();
    return;
  }
  try {
    await refreshState();
    state.apiError = null;
  } catch (e) {
    state.apiError = "לא הצלחתי להתחבר למסד הנתונים. בדוק את ה-URL/המפתח ואת החיבור לאינטרנט. (" + (e.message || e) + ")";
  }
  state.loading = false;
  render();
}

async function apiLogin(username, password) {
  const { data, error } = await sb
    .from("users")
    .select("username,password,name,role,email")
    .ilike("username", username)
    .maybeSingle();
  if (error) throw error;
  if (data && String(data.password) === String(password)) {
    return { ok: true, user: { username: data.username, name: data.name, role: data.role } };
  }
  return { ok: false, error: "שם משתמש או סיסמה שגויים" };
}

async function submitTicket(form) {
  state.busy = true; render();
  try {
    const { data, error } = await sb.from("tickets").insert({
      name: form.name, phone: form.phone, address: form.address, city: form.city, description: form.description,
      sku: form.sku, agent: form.agent, original_customer: form.originalCustomer,
      image: form.image, status: "פתוחה",
    }).select().single();
    if (error) throw error;
    await refreshState();
    state.sentNotice = true;
    state.lastTicketNumber = data.ticket_number;
    managerEmails().forEach(email => {
      sendEmailNotification(
        email,
        "פנייה חדשה נפתחה " + fmtNum(data.ticket_number),
        "נפתחה פנייה חדשה מאת " + form.name + " (" + form.phone + ").\nתיאור: " + form.description
      );
    });
  } catch (e) {
    alert("שגיאה בשליחת הפנייה: " + (e.message || e));
  }
  state.busy = false; render();
  setTimeout(() => { state.sentNotice = false; render(); }, 5000);
}

async function insertAudit(ticketId, ticketNumber, performedBy, changeType, oldValue, newValue) {
  await sb.from("audit_log").insert({
    ticket_id: ticketId, ticket_number: ticketNumber, performed_by: performedBy,
    change_type: changeType, old_value: oldValue, new_value: newValue,
  });
}

async function assignTicket(ticketId, technician, date, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const { error } = await sb.from("tickets").update({ technician, treatment_date: date, status: "משויכת" }).eq("id", ticketId);
    if (error) throw error;
    await insertAudit(ticketId, t.ticketNumber, managerName, "שיוך לטכנאי", "—", technician);
    await insertAudit(ticketId, t.ticketNumber, managerName, "תאריך טיפול", "—", date);
    await refreshState();
    sendEmailNotification(
      technicianEmail(technician),
      "שויכה אליך פנייה חדשה " + fmtNum(t.ticketNumber),
      "פנייה " + fmtNum(t.ticketNumber) + " שויכה אליך.\nלקוח: " + t.name + " (" + t.phone + ")\nתיאור: " + t.description + "\nתאריך טיפול: " + date
    );
  } catch (e) { alert("שגיאה בשיוך: " + (e.message || e)); }
  state.busy = false; render();
}

async function managerUpdateTicket(ticketId, date, status, technician, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    if (t.technician !== technician) await insertAudit(ticketId, t.ticketNumber, managerName, "החלפת טכנאי", t.technician || "—", technician);
    if (t.treatmentDate !== date) await insertAudit(ticketId, t.ticketNumber, managerName, "שינוי יום טיפול", t.treatmentDate || "—", date);
    if (t.status !== status) await insertAudit(ticketId, t.ticketNumber, managerName, "עדכון סטטוס", t.status, status);
    const { error } = await sb.from("tickets").update({ technician, treatment_date: date, status }).eq("id", ticketId);
    if (error) throw error;
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון: " + (e.message || e)); }
  state.busy = false; render();
}

const DETAIL_FIELD_LABELS = { name: "שם לקוח", phone: "טלפון", city: "עיר", address: "כתובת", description: "תיאור תקלה", sku: 'מק"ט', agent: "סוכן", originalCustomer: "לקוח מקורי" };
const DETAIL_FIELD_DB_KEYS = { name: "name", phone: "phone", city: "city", address: "address", description: "description", sku: "sku", agent: "agent", originalCustomer: "original_customer" };

async function managerUpdateDetails(ticketId, updates, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const dbUpdates = {};
    for (const key of Object.keys(updates)) {
      const oldVal = t[key] || "—";
      const newVal = updates[key] || "—";
      if (oldVal !== newVal) {
        await insertAudit(ticketId, t.ticketNumber, managerName, "עדכון " + DETAIL_FIELD_LABELS[key], oldVal, newVal);
        dbUpdates[DETAIL_FIELD_DB_KEYS[key]] = updates[key];
      }
    }
    if (Object.keys(dbUpdates).length) {
      const { error } = await sb.from("tickets").update(dbUpdates).eq("id", ticketId);
      if (error) throw error;
    }
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון פרטים: " + (e.message || e)); }
  state.editingDetailsTicketId = null;
  state.busy = false; render();
}

async function addAgentNote(ticketId, note, agentName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const oldVal = t.agentNotes || "—";
    const newVal = note || "—";
    if (oldVal !== newVal) {
      await insertAudit(ticketId, t.ticketNumber, agentName, "הערת סוכן", oldVal, newVal);
      const { error } = await sb.from("tickets").update({ agent_notes: note }).eq("id", ticketId);
      if (error) throw error;
      await refreshState();
    }
  } catch (e) { alert("שגיאה בשמירת הערה: " + (e.message || e)); }
  state.busy = false; render();
}

async function addManagerNote(ticketId, note, managerName) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    const oldVal = t.managerNotes || "—";
    const newVal = note || "—";
    if (oldVal !== newVal) {
      await insertAudit(ticketId, t.ticketNumber, managerName, "הערת מנהל", oldVal, newVal);
      const { error } = await sb.from("tickets").update({ manager_notes: note }).eq("id", ticketId);
      if (error) throw error;
      await refreshState();
    }
  } catch (e) { alert("שגיאה בשמירת הערה: " + (e.message || e)); }
  state.busy = false; render();
}

async function updateTicketByTech(ticketId, technicianName, date, status, notes, techImage) {
  state.busy = true; render();
  try {
    const t = findTicket(ticketId);
    if (t.treatmentDate !== date) await insertAudit(ticketId, t.ticketNumber, technicianName, "שינוי יום טיפול", t.treatmentDate || "—", date);
    if (t.status !== status) await insertAudit(ticketId, t.ticketNumber, technicianName, "עדכון סטטוס", t.status, status);
    if ((t.technicianNotes || "") !== (notes || "")) await insertAudit(ticketId, t.ticketNumber, technicianName, "הערת טכנאי", t.technicianNotes || "—", notes || "—");
    const updates = { treatment_date: date, status, technician_notes: notes || "" };
    if (techImage) updates.technician_image = techImage;
    const { error } = await sb.from("tickets").update(updates).eq("id", ticketId);
    if (error) throw error;
    await refreshState();
  } catch (e) { alert("שגיאה בעדכון: " + (e.message || e)); }
  state.busy = false; render();
}

function miniField(label, value) {
  return `<div><div class="light" style="font-size:11px; margin-bottom:2px">${esc(label)}</div><div style="font-size:15px; font-weight:600; color:#0f172a">${esc(value) || "—"}</div></div>`;
}

function toWaDigits(phone) {
  let digits = String(phone).replace(/\D/g, "");
  if (!digits) return null;
  if (digits.startsWith("0")) digits = "972" + digits.slice(1);
  else if (!digits.startsWith("972")) digits = "972" + digits;
  return digits;
}
function waLink(phone, ticketNumber) {
  if (!phone) return null;
  const digits = toWaDigits(phone);
  if (!digits) return null;
  const waMessage = "שלום,\nמדבר הטכנאי. אני בדרך אליך לטיפול בתקלה.\nאשמח אם תשלח לי את המיקום המדויק שלך (אפשר לשלוח מיקום ב-Waze), כדי שאוכל להגיע אליך בקלות.\nתודה!";
  const text = "?text=" + encodeURIComponent(waMessage);
  return "https://wa.me/" + digits + text;
}
function waSurveyLink(phone, name) {
  if (!phone) return null;
  const digits = toWaDigits(phone);
  if (!digits) return null;
  const greeting = name ? "שלום " + name + "," : "שלום,";
  const waMessage = greeting + "\nהטיפול בתקלה שלך הושלם 🙂\nנשמח לשמוע איך היה השירות שקיבלת — הטכנאי, זמן ההגעה, ואיכות הטיפול.\nהמשוב שלך חשוב לנו מאוד, תודה!";
  const text = "?text=" + encodeURIComponent(waMessage);
  return "https://wa.me/" + digits + text;
}

function surveyButtonHtml(t) {
  if (t.status !== "סגורה") return "";

function managerHtml() {
  const open = state.tickets.filter(t => t.status === "פתוחה");
  const technicians = state.users.filter(u => u.role === "technician");
  const mTab = state.managerTab || "open";

  const search = (state.allSearch || "").trim().toLowerCase();
  const statusFilter = state.allStatusFilter || "all";
  const cityFilter = state.allCityFilter || "all";
  const allCities = [...new Set(state.tickets.map(t => t.city).filter(Boolean))].sort();
  let all = state.tickets;
  if (statusFilter !== "all") all = all.filter(t => t.status === statusFilter);
  if (cityFilter !== "all") all = all.filter(t => t.city === cityFilter);
  if (search) {
    all = all.filter(t => {
      const hay = [fmtNum(t.ticketNumber), t.name, t.phone, t.description, t.sku, t.agent, t.address].join(" ").toLowerCase();
      return hay.includes(search);
    });
  }

  let body = "";
  if (mTab === "open") {
    body = open.length === 0 ? `<div class="empty">אין פניות פתוחות ממתינות לשיוך.</div>` :
      open.map(t => assignCardHtml(t, technicians)).join("");
  } else if (mTab === "all") {
    body = `
      <div class="row" style="margin-bottom:14px">
        <label style="flex:1; min-width:200px"><span class="label">🔍 חיפוש (שם, טלפון, מק"ט, תיאור...)</span><input type="text" id="allSearchInput" value="${esc(state.allSearch||'')}" placeholder="חיפוש פנייה..."></label>
        <label><span class="label">סינון לפי סטטוס</span>
          <select id="allStatusSelect">
            <option value="all" ${statusFilter==='all'?'selected':''}>הכל</option>
            <option value="פתוחה" ${statusFilter==='פתוחה'?'selected':''}>פתוחה</option>
            <option value="משויכת" ${statusFilter==='משויכת'?'selected':''}>משויכת</option>
            <option value="בטיפול" ${statusFilter==='בטיפול'?'selected':''}>בטיפול</option>
            <option value="סגורה" ${statusFilter==='סגורה'?'selected':''}>סגורה</option>
            <option value="נדחתה" ${statusFilter==='נדחתה'?'selected':''}>נדחתה</option>
          </select>
        </label>
        <label><span class="label">סינון לפי עיר</span>
          <select id="allCitySelect">
            <option value="all" ${cityFilter==='all'?'selected':''}>כל הערים</option>
            ${allCities.map(c => `<option value="${esc(c)}" ${cityFilter===c?'selected':''}>${esc(c)}</option>`).join("")}
          </select>
        </label>
        <button type="button" class="btn-dark-sm" id="exportCsvBtn" style="align-self:flex-end">⬇️ ייצוא ל-CSV (${all.length})</button>
      </div>
      ${all.length === 0 ? `<div class="empty">לא נמצאו פניות תואמות.</div>` : all.map(t => allTicketCardHtml(t, technicians)).join("")}
    `;
  }

  return `
    <div class="pill-row">
      <button class="pill ${mTab==='open'?'active':''}" data-mtab="open">📋 פניות פתוחות (${open.length})</button>
      <button class="pill ${mTab==='all'?'active':''}" data-mtab="all">🔧 כל הפניות (${state.tickets.length})</button>
      <button class="pill" id="refreshBtn" style="margin-right:auto">🔄 רענון</button>
    </div>
    <div>${body}</div>
  `;
}

        <div class="techImgPreview">${t.technicianImage ? `<img class="thumb" style="margin-top:8px" src="${t.technicianImage}">` : ""}</div>
      </label>
      <button class="btn-dark-sm techSaveBtn">שמירת שינוי</button>
      <div style="margin-top:10px">${ticketAuditToggleHtml(t)}</div>
    </div>
  `).join("");

  return refreshBar + filterBar + cards;
}

let pendingImage = null;

function wireEvents() {
  // Customer form
  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) {
    document.getElementById("f_image").onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (reader.result.length > 2000000) {
          alert("התמונה גדולה מדי. נסה תמונה קטנה/דחוסה יותר (עד כ-1.5MB).");
          e.target.value = "";
          return;
        }
        pendingImage = reader.result;
        document.getElementById("imgPreview").innerHTML = `<img class="thumb" style="margin-top:8px" src="${pendingImage}">`;
      };
      reader.readAsDataURL(file);
    };
    wireWizardEvents();
    submitBtn.onclick = () => {
      const name = document.getElementById("f_name").value.trim();
      const phone = document.getElementById("f_phone").value.trim();
      const city = document.getElementById("f_city").value;
      const address = document.getElementById("f_address").value.trim();
      const originalCustomer = document.getElementById("f_original").value.trim();
      const extraNotes = document.getElementById("f_extra_notes").value.trim();
      const composedDesc = getComposedDescription();
      if (!composedDesc) {
        alert("יש להשלים את תיאור התקלה (לבחור קטגוריה ולענות על השאלות) לפני השליחה.");
        return;
      }
      if (!name || !phone || !city || !address || !originalCustomer) {
        alert("יש למלא שם, טלפון, עיר, כתובת, ולקוח סופי — שדות חובה.");
        return;
      }
      const description = composedDesc + (extraNotes ? " | הערות: " + extraNotes : "");
      const img = pendingImage;
      pendingImage = null;
      resetWizard();
      submitTicket({
        name, phone, city, address, description, originalCustomer,
        sku: document.getElementById("f_sku").value.trim(),
        agent: document.getElementById("f_agent").value.trim(),
        image: img,
      });
    };
  }

  // Public status check
  const statusCheckBtn = document.getElementById("statusCheckBtn");
  if (statusCheckBtn) {
    const runCheck = () => {
      const numRaw = document.getElementById("sc_number").value.trim().replace(/^#/, "");
      const phoneRaw = document.getElementById("sc_phone").value.trim();
      const num = numRaw ? parseInt(numRaw, 10) : null;
      const phoneDigits = phoneRaw.replace(/\D/g, "");
      if (!num && !phoneDigits) {
        state.statusCheckError = "יש למלא מספר פנייה, טלפון, או שניהם.";
        state.statusCheckResults = undefined;
        render();
        return;
      }
      let matches;
      if (num && phoneDigits) {
        matches = state.tickets.filter(t => t.ticketNumber === num && String(t.phone).replace(/\D/g, "").endsWith(phoneDigits.slice(-9)));
      } else if (num) {
        matches = state.tickets.filter(t => t.ticketNumber === num);
      } else {
        matches = state.tickets.filter(t => String(t.phone).replace(/\D/g, "").endsWith(phoneDigits.slice(-9)));
      }
      state.statusCheckError = "";
      state.statusCheckResults = matches;
      render();
    };
    statusCheckBtn.onclick = runCheck;
    ["sc_number", "sc_phone"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onkeydown = (e) => { if (e.key === "Enter") runCheck(); };
    });
  }

  // Login
  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn) {
    const tryLogin = async () => {
      const u = document.getElementById("l_username").value.trim();
      const p = document.getElementById("l_password").value;
      loginBtn.disabled = true;
      loginBtn.textContent = "מתחבר...";
      try {
        const res = await apiLogin(u, p);
        if (res.ok) { state.currentUser = res.user; state.loginError = ""; }
        else { state.loginError = res.error || "שם משתמש או סיסמה שגויים"; }
      } catch (e) {
        state.loginError = "שגיאת תקשורת עם השרת — נסה שוב";
      }
      render();
    };
    loginBtn.onclick = tryLogin;
    ["l_username","l_password"].forEach(id => {
      document.getElementById(id).onkeydown = (e) => { if (e.key === "Enter") tryLogin(); };
    });
  }

  // Manager tabs
  document.querySelectorAll("[data-mtab]").forEach(b => b.onclick = () => { state.managerTab = b.dataset.mtab; render(); });

  // Manual refresh
  const refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.onclick = async () => {
    state.loading = true; render();
    try { await refreshState(); } catch (e) {}
    state.loading = false;
    render();
  };

  // All-tickets search & status filter
  const allSearchInput = document.getElementById("allSearchInput");
  if (allSearchInput) allSearchInput.oninput = () => { state.allSearch = allSearchInput.value; render(); };
  const allStatusSelect = document.getElementById("allStatusSelect");
  if (allStatusSelect) allStatusSelect.onchange = () => { state.allStatusFilter = allStatusSelect.value; render(); };
  const allCitySelect = document.getElementById("allCitySelect");
  if (allCitySelect) allCitySelect.onchange = () => { state.allCityFilter = allCitySelect.value; render(); };
  const exportCsvBtn = document.getElementById("exportCsvBtn");
  if (exportCsvBtn) exportCsvBtn.onclick = () => {
    const search = (state.allSearch || "").trim().toLowerCase();
    const statusFilter = state.allStatusFilter || "all";
    const cityFilter = state.allCityFilter || "all";
    let list = state.tickets;
    if (statusFilter !== "all") list = list.filter(t => t.status === statusFilter);
    if (cityFilter !== "all") list = list.filter(t => t.city === cityFilter);
    if (search) {
      list = list.filter(t => {
        const hay = [fmtNum(t.ticketNumber), t.name, t.phone, t.description, t.sku, t.agent, t.address].join(" ").toLowerCase();
        return hay.includes(search);
      });
    }
    exportTicketsCSV(list);
  };

  // Assign
  document.querySelectorAll("[data-assign]").forEach(card => {
    const id = card.dataset.assign;
    card.querySelector(".assignBtn").onclick = () => {
      const tech = card.querySelector(".assignTech").value;
      const date = card.querySelector(".assignDate").value;
      assignTicket(id, tech, date, state.currentUser.name);
    };
  });

  // Agent status filter + notes
  const agentStatusSelect = document.getElementById("agentStatusSelect");
  if (agentStatusSelect) agentStatusSelect.onchange = () => { state.agentStatusFilter = agentStatusSelect.value; render(); };
  document.querySelectorAll(".agentSaveNoteBtn").forEach(b => {
    b.onclick = () => {
      const card = b.closest(".card");
      const note = card.querySelector(".agentNoteInput").value.trim();
      addAgentNote(b.dataset.id, note, state.currentUser.name);
    };
  });

  // Per-ticket audit log toggle
  document.querySelectorAll(".ticketAuditToggle").forEach(b => {
    b.onclick = () => {
      state.expandedTicketAuditId = state.expandedTicketAuditId === b.dataset.id ? null : b.dataset.id;
      render();
    };
  });

  // Manager notes
  document.querySelectorAll(".mgrSaveNoteBtn").forEach(b => {
    b.onclick = () => {
      const card = b.closest(".card");
      const note = card.querySelector(".mgrNoteInput").value.trim();
      addManagerNote(b.dataset.id, note, state.currentUser.name);
    };
  });

  // Edit ticket details (all tab)
  document.querySelectorAll(".editDetailsToggle").forEach(b => b.onclick = () => { state.editingDetailsTicketId = b.dataset.id; render(); });
  document.querySelectorAll(".cancelEditBtn").forEach(b => b.onclick = () => { state.editingDetailsTicketId = null; render(); });
  document.querySelectorAll(".saveDetailsBtn").forEach(b => {
    b.onclick = () => {
      const card = b.closest(".card");
      const updates = {
        name: card.querySelector(".editName").value.trim(),
        phone: card.querySelector(".editPhone").value.trim(),
        city: card.querySelector(".editCity").value,
        address: card.querySelector(".editAddress").value.trim(),
        description: card.querySelector(".editDescription").value.trim(),
        sku: card.querySelector(".editSku").value.trim(),
        agent: card.querySelector(".editAgent").value.trim(),
        originalCustomer: card.querySelector(".editOriginal").value.trim(),
      };
      if (!updates.name || !updates.phone || !updates.city || !updates.address || !updates.description || !updates.originalCustomer) {
        alert("שם, טלפון, עיר, כתובת, תיאור התקלה, ולקוח מקורי הם שדות חובה.");
        return;
      }
      managerUpdateDetails(b.dataset.id, updates, state.currentUser.name);
    };
  });

  // Manager date+status+technician change (all tab)
  document.querySelectorAll("[data-ticket]").forEach(card => {
    const btn = card.querySelector(".mgrUpdateBtn");
    if (!btn) return;
    const dateInput = card.querySelector(".mgrDate");
    const statusSelect = card.querySelector(".mgrStatus");
    const techSelect = card.querySelector(".mgrTech");
    btn.onclick = () => {
      managerUpdateTicket(card.dataset.ticket, dateInput.value, statusSelect.value, techSelect.value, state.currentUser.name);
    };
  });

  // Audit filter + search + row expand
  const auditSel = document.getElementById("auditFilterSel");
  if (auditSel) auditSel.onchange = () => { state.auditFilter = auditSel.value; render(); };
  const auditSearchInput = document.getElementById("auditSearchInput");
  if (auditSearchInput) auditSearchInput.oninput = () => { state.auditSearch = auditSearchInput.value; render(); };
  document.querySelectorAll("tr[data-audit]").forEach(tr => {
    tr.onclick = () => {
      const id = tr.dataset.audit;
      state.expandedAudit = state.expandedAudit === id ? null : id;
      render();
    };
  });

  // Technician filters
  const techStatusSelect = document.getElementById("techStatusSelect");
  if (techStatusSelect) techStatusSelect.onchange = () => { state.techStatusFilter = techStatusSelect.value; render(); };
  const techCitySelect = document.getElementById("techCitySelect");
  if (techCitySelect) techCitySelect.onchange = () => { state.techCityFilter = techCitySelect.value; render(); };
  const techDateFilterInput = document.getElementById("techDateFilterInput");
  if (techDateFilterInput) techDateFilterInput.onchange = () => { state.techDateFilter = techDateFilterInput.value; render(); };
  const techFilterClear = document.getElementById("techFilterClear");
  if (techFilterClear) techFilterClear.onclick = () => { state.techStatusFilter = "all"; state.techDateFilter = ""; state.techCityFilter = "all"; render(); };

  // Technician
  document.querySelectorAll("[data-tech]").forEach(card => {
    const id = card.dataset.tech;
    let pendingTechImage = null;
    const imgInput = card.querySelector(".techImageInput");
    if (imgInput) {
      imgInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (reader.result.length > 2000000) {
            alert("התמונה גדולה מדי. נסה תמונה קטנה/דחוסה יותר (עד כ-1.5MB).");
            e.target.value = "";
            return;
          }
          pendingTechImage = reader.result;
          card.querySelector(".techImgPreview").innerHTML = `<img class="thumb" style="margin-top:8px" src="${pendingTechImage}">`;
        };
        reader.readAsDataURL(file);
      };
    }
    const btn = card.querySelector(".techSaveBtn");
    btn.onclick = () => {
      const date = card.querySelector(".techDate").value;
      const status = card.querySelector(".techStatus").value;
      const notes = card.querySelector(".techNotes").value;
      updateTicketByTech(id, state.currentUser.name, date, status, notes, pendingTechImage);
    };
  });
}

window.addEventListener("error", (e) => {
  const app = document.getElementById("app");
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = `
      <div style="max-width:480px; margin:60px auto; text-align:center; padding:0 20px; font-family:sans-serif">
        <div style="font-size:34px; margin-bottom:12px">⚠️</div>
        <h2>שגיאה בטעינת האפליקציה</h2>
        <p style="color:#64748b">${(e.message || e.error || "שגיאה לא ידועה").toString()}</p>
      </div>
    `;
  }
});

document.addEventListener("click", (e) => {
  if (e.target.tagName === "IMG" && e.target.classList.contains("thumb")) {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(10,14,26,0.9); display:flex; align-items:center; justify-content:center; z-index:1000; cursor:zoom-out; padding:24px; animation:fadeInUp .15s ease";
    const img = document.createElement("img");
    img.src = e.target.src;
    img.style.cssText = "max-width:100%; max-height:100%; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.5)";
    overlay.appendChild(img);
    overlay.onclick = () => overlay.remove();
    document.body.appendChild(overlay);
  }
});

initialLoad();
</script>
</body>
</html>
